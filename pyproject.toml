[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "ollaborate-desk"
version = "0.2.0"
description = "A local, offline task assistant powered by Ollama and Ollaborate"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["fastapi>=0.115", "uvicorn>=0.30", "ollaborate>=0.1.0", "pypdf>=5", "httpx[socks]>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]
semantic = ["libreindex>=0.1.0"]

[project.scripts]
ollaborate-desk = "ollaborate_desk.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ollaborate_desk"]
