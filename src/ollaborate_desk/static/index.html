<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ollaborate Desk</title><style>
:root{color-scheme:dark;font-family:system-ui,sans-serif;background:#101723;color:#ecf1f6}*{box-sizing:border-box}body{margin:0}header{padding:20px 5%;border-bottom:1px solid #334055;display:flex;justify-content:space-between;align-items:center}h1{font-size:22px;margin:0}small{color:#abc0d2}main{max-width:1100px;margin:36px auto;padding:0 20px;display:grid;grid-template-columns:220px 1fr;gap:24px}aside,section{background:#192537;border:1px solid #344457;border-radius:16px;padding:22px}aside{align-self:start}button{background:#84e0bc;color:#0c2421;border:0;border-radius:9px;padding:10px 16px;font-weight:700;cursor:pointer}button:disabled{opacity:.5}textarea,input{width:100%;background:#101723;color:white;border:1px solid #526176;border-radius:9px;padding:12px;font:inherit}textarea{height:140px;resize:vertical}h2{font-size:19px}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:inherit;line-height:1.6}.evidence{border-left:3px solid #84e0bc;padding:8px 15px;margin:14px 0;background:#152031}.muted{color:#a9b9c8}.row{display:flex;gap:10px;margin-top:12px}.row input{max-width:260px}.history button{display:block;width:100%;margin:7px 0;background:#273950;color:#eaf0f5;text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}@media(max-width:700px){main{display:block}aside{margin-bottom:20px}}
</style></head><body><header><h1>◈ Ollaborate Desk</h1><small id="status">Local assistant</small></header><main><aside><h2>Workspace</h2><p class="muted" id="source"></p><button id="index">Re-index files</button><p id="index-result" class="muted"></p><h2>Tasks</h2><div id="history" class="history"></div></aside><section><h2>What should we get done?</h2><p class="muted">Your files provide context. Each result is a draft for your review.</p><textarea id="instruction" placeholder="Summarize the project notes and draft a status update..."></textarea><div class="row"><button id="run">Run task</button><span id="progress" class="muted"></span></div><div id="result" hidden><h2>Draft result</h2><pre id="output"></pre><h2>Evidence from local files</h2><div id="evidence"></div><div class="row"><input id="filename" value="draft.md" aria-label="Output filename"><button id="save">Save reviewed draft</button></div><p class="muted" id="saved"></p></div></section></main><script>
const $=id=>document.getElementById(id);let active=null;
async function api(path,options){const r=await fetch(path,options);const v=await r.json();if(!r.ok)throw Error(v.detail||r.statusText);return v}
function show(task){active=task;$('result').hidden=false;$('output').textContent=task.output;$('evidence').replaceChildren();for(const [i,item] of task.evidence.entries()){const div=document.createElement('div');div.className='evidence';const title=document.createElement('strong');title.textContent=`[${i+1}] ${item.path}`;const excerpt=document.createElement('pre');excerpt.textContent=item.excerpt;div.append(title,excerpt);$('evidence').append(div)}if(!task.evidence.length)$('evidence').textContent='No matching local evidence was found.';$('saved').textContent=task.status==='saved'?'This draft was saved.':''}
async function history(){let tasks=await api('/api/tasks');$('history').replaceChildren();for(const task of tasks){let b=document.createElement('button');b.textContent=task.instruction;b.title=task.instruction;b.onclick=()=>show(task);$('history').append(b)}}
$('run').onclick=async()=>{let instruction=$('instruction').value.trim();if(!instruction)return;$('run').disabled=true;$('progress').textContent='Local agents are working…';try{show(await api('/api/tasks',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({instruction})}));await history()}catch(e){$('progress').textContent=e.message}finally{$('run').disabled=false;if($('progress').textContent==='Local agents are working…')$('progress').textContent='Done'}};
$('index').onclick=async()=>{ $('index').disabled=true;$('index-result').textContent='Indexing…';try{let r=await api('/api/index',{method:'POST'});$('index-result').textContent=`${r.files} files, ${r.chunks} chunks. ${r.skipped} skipped.`}catch(e){$('index-result').textContent=e.message}finally{$('index').disabled=false}};
$('save').onclick=async()=>{try{let r=await api('/api/save',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({task_id:active.id,filename:$('filename').value})});$('saved').textContent=`Saved: ${r.path}`;await history()}catch(e){$('saved').textContent=e.message}};
api('/api/status').then(s=>{$('status').textContent=`Offline · ${s.model}`;$('source').textContent=s.source+(s.gpu.length?` · ${s.gpu.map(g=>`${g.name} (${g.memory_used_mib}/${g.memory_total_mib} MiB)`).join(', ')}`:' · GPU status unavailable')});history().catch(e=>{$('progress').textContent=e.message});
</script></body></html>
